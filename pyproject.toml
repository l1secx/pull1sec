[project]
name = "pull1sec"
version = "1.0.0"
description = "Paste any social media URL, get the video. Self-hosted downloader built on yt-dlp."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "yt-dlp[default,curl-cffi]>=2025.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
pull1sec = "pull1sec.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pull1sec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
